    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;

  footer { margin-top: 56px; font-size: 12px; color: #55607a; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:#39d98a;
         margin-right:8px; box-shadow: 0 0 10px #39d98a; animation: pulse 1.6s infinite; }
